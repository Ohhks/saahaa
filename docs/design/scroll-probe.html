<!doctype html><meta charset=utf-8><title>scroll probe</title>
<!-- SAAHAA · the home header's collapse, tested in a real engine.

     The header used to be sticky and shrink itself on the way down. Because it
     was IN THE FLOW, collapsing it took ~340px out of the document and every
     element below leapt up at that moment — the "buffering while scrolling".
     It is ordinary flow content now, and a fixed .pinbar carrying the search
     field fades in once it has gone. This page proves the document never
     changes size and no content ever moves while you scroll.

     Run it (the dev server must be up on 8772):

       chrome --headless=new --disable-gpu --hide-scrollbars --window-size=900,900          --virtual-time-budget=40000 --user-data-dir=<tmp> --dump-dom          http://127.0.0.1:8772/docs/design/scroll-probe.html

     Expect: documentHeightConstant true · contentMovedInDocumentPx 0 ·
     pinFlipsOnTheWayDown 1 · wobbleFlips 0 · pinHiddenAtTop true.
     Not shipped — nothing under docs/ is deployed (tools/build.py --site). -->
<style>html,body{margin:0}iframe{width:420px;height:760px;border:0}</style>
<div id=out>running…</div>
<iframe id=f src="/index.html?demo=1&probe=1"></iframe>
<script>
const done = t => { document.getElementById('out').textContent = 'RESULT ' + JSON.stringify(t); document.title = 'done'; };
addEventListener('load', async () => {
  const f = document.getElementById('f'), w = f.contentWindow, d = f.contentDocument;
  await new Promise(r => setTimeout(r, 3500));
  const sp = d.querySelector('.splash'); if (sp) sp.remove();
  d.documentElement.style.scrollBehavior = 'auto';
  await new Promise(r => setTimeout(r, 500));
  const hdr = d.querySelector('.hdr--home'), pin = d.querySelector('.pinbar');
  if (!hdr || !pin) return done({ error: 'no header or no pinned bar' });

  const to = async y => { w.scrollTo(0, y); w.dispatchEvent(new Event('scroll')); await new Promise(r => setTimeout(r, 40)); };
  const pinOn = () => pin.classList.contains('on');
  const docH = () => d.documentElement.scrollHeight;

  // THE INVARIANT: scrolling must never change the size of the document, and
  // must never move content in document space. That is what made the page
  // lurch under the reader's thumb when the header shrank itself.
  const heights = new Set(), tops = [];
  const probe = d.querySelector('.grid3, .sec, .m-row');
  let flips = 0, prev = pinOn();
  for (let y = 0; y <= 1200; y += 30) {
    await to(y);
    heights.add(docH());
    if (probe) tops.push(Math.round(probe.getBoundingClientRect().top + w.scrollY));
    if (pinOn() !== prev) { flips++; prev = pinOn(); }
  }
  const contentMoved = tops.length ? Math.max(...tops) - Math.min(...tops) : null;

  // wobble at depth must not flap the bar
  let wobbleFlips = 0; prev = pinOn();
  for (const y of [900, 880, 900, 885, 905, 890, 900]) { await to(y); if (pinOn() !== prev) { wobbleFlips++; prev = pinOn(); } }

  await to(0);
  done({
    documentHeightsSeen: [...heights],
    documentHeightConstant: heights.size === 1,
    contentMovedInDocumentPx: contentMoved,
    pinFlipsOnTheWayDown: flips,
    wobbleFlips,
    pinHiddenAtTop: !pinOn(),
    headerPosition: w.getComputedStyle(hdr).position,
    pinPosition: w.getComputedStyle(pin).position,
  });
});
</script>
