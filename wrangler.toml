# SAAHAA · the SITE, as a Workers static-assets deployment.
#
# WHY THIS FILE EXISTS. Cloudflare Pages is now part of Workers, and a Pages
# project cannot be created under a name a Worker already holds. The site was
# first put up by hand from the REPO ROOT, which serves the 3 KB source shell
# and the 82 loose modules instead of the built bundle — and, more seriously,
# without dist/404.html, so any deep link died on a hard refresh. This deploys
# what tools/build.py --site actually produces.
# IT IS CALLED wrangler.toml, AND THE NAME IS THE POINT. As wrangler.site.toml
# it was invisible to anything that did not pass -c, and this account has a
# Cloudflare build connected to the GitHub repo: every push produced a
# deployment seconds later that served the REPOSITORY ROOT — the 3 KB source
# shell, with no bundle behind it. The live site was replaced twice that way
# while it was being tested, and the gate that caught it was accused of being
# broken before the deployment was.
#
# dist/ is gitignored, so a build that checks the repo out has to make it. If
# the build command below cannot run, that build now FAILS rather than quietly
# publishing the source tree.
name = "saahaa"
main = "worker-site/index.js"
compatibility_date = "2026-01-01"

[assets]
directory = "./dist"
# Named so worker-site/index.js can serve a file itself. Requests that match an
# asset are still answered before that Worker runs, so they stay free.
binding = "ASSETS"

# EVERY UNKNOWN PATH IS THE APP, NOT A MISSING FILE. This is a single-page app
# whose routes live after the #, but a customer who refreshes on a deep link
# still asks the server for it. dist/404.html is a byte-for-byte copy of the
# app (preflight enforces that with cmp), so serving it is serving the app.
not_found_handling = "404-page"

# LEFT AT THE DEFAULT, AND THE REASON IS WORTH KEEPING. "none" was set here so
# the owner console would stay at the /admin.html this repo documents, and it
# did — but "none" also stops "/" mapping to index.html, so the HOMEPAGE
# answered 404. It still painted, because not_found_handling serves the app,
# and that is exactly what makes it dangerous: the site looks perfect while
# telling every crawler and every cache that its front page does not exist.
# The default costs one 307 from /admin.html to /admin. That is the cheaper
# side of the trade.
# html_handling = "none"   ← do not.

# THE BINDING THE DASHBOARD WAS RIGHT TO SAY WAS MISSING. /api/* is handed to
# saahaa-api over Cloudflare's internal RPC: it never leaves their network,
# never resolves DNS and never crosses an origin, so the API no longer has to
# answer CORS for the whole internet and the site's connect-src no longer has
# to name every *.workers.dev in existence.
#
# The two Workers stay separate on purpose. saahaa-api holds the service-role
# key; this one holds nothing, and that is the boundary that makes a public
# static site safe to put the console on.
[[services]]
binding = "API"
service = "saahaa-api"

# Cloudflare's own build runs this before it uploads ./dist.
[build]
command = "python tools/build.py --site"
