# Build, gate, deploy. The gates run BEFORE the deploy, not after: a bundle that
# fails preflight must never reach a phone.
name: deploy
# DEPLOY WAITS FOR THE CHECK THAT GATES THE BRANCH. Running on `push` meant
# this raced CI: a bundle could reach Pages while "Lint, build, test" was still
# running, which makes the required check decorative. It now starts only when CI
# has finished, and only if it succeeded.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
jobs:
  ship:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: build the bundle
        run: python tools/build.py --site
      - name: every gate
        run: bash tools/preflight.sh
      - name: deploy to cloudflare pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=saahaa
      - name: deploy the worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy
