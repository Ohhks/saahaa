name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, build, test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      - uses: actions/setup-node@v4
        with: { node-version: '22' }

      # `node --check` parses these as CommonJS and passes files whose ES-module
      # parse fails — a backtick inside a comment inside a template literal once
      # shipped a blank screen through exactly this step. tools/lint-parse.mjs
      # compiles all 82 modules with the real parser and runs inside preflight
      # below, so this loop was both redundant and reassuring about nothing.

      - name: Domain test suite (Node)
        run: node tools/test-node.mjs

      - name: Build the Pages payload (the same build Deploy ships)
        # --site also writes index.html / 404.html / version.json; the pre-flight
        # checks those, so building without it fails the gate on a clean runner
        run: python tools/build.py --site

      - name: Pre-flight gate
        run: bash tools/preflight.sh

      - name: Migration safety lint
        run: python tools/lint-migrations.py

      - name: Upload bundle for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saahaa-bundle-${{ github.sha }}
          path: dist/
          retention-days: 7
