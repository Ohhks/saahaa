# A free Supabase project sleeps after a week without a query, and a sleeping
# database means a customer cannot claim a payment on Monday morning. This wakes
# it twice a week by calling one function that updates one row — no egress worth
# counting against the 5 GB.
#
# It also fails loudly. A keep-alive that quietly stops working is worse than
# none, because you find out when a customer does.
name: keep supabase awake
on:
  schedule:
    - cron: '17 4 * * 1,4'     # Mon & Thu, 09:47 IST
  workflow_dispatch:
jobs:
  beat:
    runs-on: ubuntu-latest
    steps:
      - name: touch the heartbeat
        run: |
          code=$(curl -s -o /tmp/out -w '%{http_code}' -X POST \
            "${{ secrets.SUPABASE_URL }}/rest/v1/rpc/beat" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H 'content-type: application/json' -d '{}')
          echo "HTTP $code"; cat /tmp/out
          test "$code" = "200"
